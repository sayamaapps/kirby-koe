name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # lowest: the oldest dependencies allowed by composer.json (Kirby 5.0.0 included).
        # highest: the newest versions. composer.lock is not committed (see .gitignore).
        deps: [lowest, highest]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          coverage: none

      - name: Install dependencies, lowest versions
        if: matrix.deps == 'lowest'
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable --ignore-platform-req=ext-gd

      - name: Install dependencies, highest versions
        if: matrix.deps == 'highest'
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      - name: Tests (Kirby as fixture)
        run: vendor/bin/phpunit

      - name: The CLI runs without Kirby and without a key (exit 3)
        if: matrix.deps == 'highest'
        run: |
          set +e
          bin/koe-fetch
          status=$?
          set -e
          [ "$status" = "3" ] || { echo "::error::expected exit 3 without GOOGLE_PLACES_API_KEY, got $status"; exit 1; }

  analysis:
    name: Analysis, PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      - name: Composer validate
        run: composer validate --strict --no-check-version --no-check-all

      - name: Composer normalize
        run: composer normalize --dry-run --no-interaction

      - name: Undeclared dependencies
        run: composer analyze:require-checker

      - name: Unused dependencies
        run: composer analyze:unused

      - name: Platform requirements
        run: composer check-platform-reqs

      - name: Psalm
        run: composer analyze:psalm

      - name: PHP Mess Detector
        run: composer analyze:phpmd

  style:
    name: Code style, PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # getkirby/php-cs needs PHP 8.3 or newer, so it is installed globally and
      # not as a dependency: the package itself supports PHP 8.2.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install php-cs
        run: |
          composer global require --no-interaction getkirby/php-cs:0.2.1
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Check code style
        run: kirby-cs fix --dry-run --diff

  # Kirby 6 is a pre-release. This job runs the same tests against it so the
  # next major shows up early. Failing tests show up as a warning and never
  # fail the workflow, so main keeps its green check. Kirby 6 is
  # required only inside the job: composer.json and the tags stay on Kirby 5,
  # so nothing changes for a site that installs this plugin.
  kirby-6:
    name: Kirby 6 pre-release, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Kirby 6 supports PHP 8.3 to 8.5.
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          coverage: none

      # platform.php resolves the dependencies for PHP 8.2, which Kirby 6 no
      # longer supports. ^6.0@beta installs the newest Kirby 6 release: a beta
      # or release candidate until the stable version is out.
      - name: Install dev dependencies with Kirby 6
        run: |
          composer config --unset platform.php
          composer require --dev 'getkirby/cms:^6.0@beta' --with-all-dependencies --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      - name: Tests
        run: vendor/bin/phpunit || echo "::warning title=Kirby 6::Tests fail against the Kirby 6 pre-release, see the log"
