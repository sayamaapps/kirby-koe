name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          coverage: none

      - name: Install dev dependencies (Kirby as fixture)
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      - name: Tests
        run: sh tests/run.sh

      - name: The CLI runs without Kirby and without a key (exit 3)
        run: |
          set +e
          bin/koe-fetch
          status=$?
          set -e
          [ "$status" = "3" ] || { echo "::error::expected exit 3 without GOOGLE_PLACES_API_KEY, got $status"; exit 1; }
